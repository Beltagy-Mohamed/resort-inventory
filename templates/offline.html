{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لا يوجد اتصال بالإنترنت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            font-family: 'Cairo', sans-serif;
        }
        .offline-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        .offline-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .offline-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .offline-text {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .retry-btn {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .retry-btn:hover {
            background-color: #157347;
            color: white;
            transform: translateY(-2px);
        }
        .app-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="offline-container">
        <img src="{% static 'images/logo.jpg' %}" alt="Logo" class="app-logo">
        <div class="offline-icon">
            <i class="fa-solid fa-wifi" style="position: relative;">
                <i class="fa-solid fa-slash" style="position: absolute; left: 0; top: 0; color: #333;"></i>
            </i>
        </div>
        <h1 class="offline-title">أنت حالياً غير متصل</h1>
        <p class="offline-text">
            عذراً، لا يوجد اتصال بالإنترنت حالياً.<br>
            برجاء التحقق من اتصالك بالشبكة أو الواي فاي والمحاولة مرة أخرى للوصول إلى النظام.
        </p>
        <button onclick="window.location.reload()" class="retry-btn">
            <i class="fa-solid fa-rotate-right me-2"></i> إعادة المحاولة
        </button>
    </div>

</body>
</html>
