{% extends "layout/base.html" %}


{% block title %}
Delete Category
{% endblock %}

{% block content %}

<div class="delete-card">

    <h2>Delete Category</h2>

    <p>

        Are you sure you want to delete this category?

        <strong>{{ category.name }}</strong>؟

    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn-delete">

            Yes, delete

        </button>

        <a
            href="{% url 'categories_list' %}"
            class="btn-save">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
