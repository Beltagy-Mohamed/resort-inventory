{% extends "layout/base.html" %}
{% load static %}

{% block title %}
تعديل الفئة
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/products.css' %}">
{% endblock %}

{% block content %}

<h1>تعديل الفئة</h1>

<form method="post" class="product-form">

    {% csrf_token %}

    <div class="form-group">

        <label>{{ form.name.label }}</label>

        {{ form.name }}

    </div>

    <div class="form-group category-color-field">
        <label>{{ form.color.label }}</label>
        {{ form.color }}
        <small>اختر لون الفئة المستخدم في رسوم لوحة التحكم.</small>
    </div>

    <button type="submit" class="btn-save">
        حفظ التغييرات
    </button>

</form>

{% endblock %}
