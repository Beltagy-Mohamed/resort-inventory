{% extends 'layout/base.html' %}
{% load static %}

{% block title %}تعيين اسم العرض{% endblock %}

{% block content %}
<div style="max-width:440px; margin: 60px auto; padding: 0 16px;">
    <div style="background: var(--card-bg,#fff); border-radius: 18px; padding: 36px 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align:center;">
        <i class="bi bi-person-circle" style="font-size: 3.5rem; color: #3498DB; display:block; margin-bottom:16px;"></i>
        <h2 style="margin-bottom: 8px;">مرحباً بك في الدردشة 👋</h2>
        <p style="color:#888; margin-bottom:28px; font-size:.93rem;">
            اكتب اسمك الذي سيظهر للآخرين في المحادثات
        </p>
        <form method="post" action="{% url 'chat_set_name' %}">
            {% csrf_token %}
            <input
                type="text"
                name="display_name"
                class="form-control"
                placeholder="اكتب اسمك هنا..."
                value="{{ profile.display_name }}"
                required
                maxlength="60"
                dir="auto"
                autofocus
                style="text-align:center; font-size:1.1rem; padding:12px 18px; border-radius:12px; margin-bottom:16px;"
            >
            <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; border-radius:12px; font-size:1rem;">
                <i class="bi bi-check-circle"></i> حفظ والدخول للدردشة
            </button>
        </form>
    </div>
</div>
{% endblock %}
