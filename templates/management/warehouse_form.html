{% extends "layout/base.html" %}
{% load i18n %}
{% load static %}
{% block title %}{{ action }}{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/products.css' %}">
{% endblock %}
{% block content %}
<div class="page-header">
    <h1>{{ action }}</h1>
</div>
<div class="form-container">
    <form method="post" class="product-form">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions" style="margin-top: 20px;">
            <button type="submit" class="btn-primary">{% trans 'حفظ' %}</button>
            <a href="{% url 'warehouses_list' %}" class="btn-secondary" style="margin-right: 10px; padding: 10px; text-decoration: none; border-radius: 4px; border: 1px solid #ccc; color: #333;">{% trans 'إلغاء' %}</a>
        </div>
    </form>
</div>
{% endblock %}
