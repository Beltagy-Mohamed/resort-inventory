{% extends "layout/base.html" %}
{% load i18n %}

{% load static %}

{% block title %}
{% trans "Add Color" %}
{% endblock %}

{% block extra_css %}

{% endblock %}

{% block content %}

    {{ form.as_p }}

    <button class="btn-save">

        {% trans "Save" %}

    </button>

</form>

{% endblock %}
