# Nginx site config — copy to /etc/nginx/sites-available/inventory
# then: ln -s /etc/nginx/sites-available/inventory /etc/nginx/sites-enabled/
# Run certbot afterwards to add HTTPS (certbot rewrites this file automatically).

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    location /static/ {
        alias /var/www/inventory/staticfiles/;
    }

    location /media/ {
        alias /var/www/inventory/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
